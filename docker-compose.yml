services:
  tor:
    image: osminogin/tor-simple:0.4.9.14@sha256:ea335859425375b3294b15a5df61ca317ca4fdd143cf7a8d568bb2cd48217774
    container_name: ${TOR_CONTAINER_NAME:-sealapi_tor_proxy}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TOR_HOST_PORT:-9050}:9050"
    healthcheck:
      test: ["CMD-SHELL", "RESP=$$(printf '\\x05\\x01\\x00' | nc -w 2 127.0.0.1 9050 2>/dev/null | head -c 2); [ \"$$RESP\" = \"$$(printf '\\x05\\x00')\" ] || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  sealapi-lead-research:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-sealapi-lead-research:latest}
    container_name: ${APP_CONTAINER_NAME:-sealapi_lead_research_app}
    restart: unless-stopped
    depends_on:
      tor:
        condition: service_healthy
    ports:
      - "${HOST_IP:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
      - "${HOST_IP:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    environment:
      - DATA_DIR=/app/data
      - PORT=3000
      - BACKEND_API_URL=http://127.0.0.1:8000
      - APP_ENV=${APP_ENV:-production}
      - API_SECRET_KEY=${API_SECRET_KEY:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - CONCURRENCY=${CONCURRENCY:-2}
      - SCRAPER_TIMEOUT=${SCRAPER_TIMEOUT:-25}
      - TOR_PROXY=${TOR_PROXY:-socks5://tor:9050}
      - TOR_ENABLED=${TOR_ENABLED:-true}
      - USER_AGENT=${USER_AGENT:-"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36 SealAPIResearchBot/1.0"}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DATA_MOUNT_DIR:-./data}:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
